<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/auth.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Buckshot Roulette Unblocked - Free Stuff</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { background: #000; margin: 0; padding: 0; overflow: hidden; touch-action: none; color: white; }
        #canvas { display: block; width: 100vw; height: 100vh; }
        #canvas:focus { outline: none; }
        .back-btn { position: fixed; top: 20px; left: 20px; z-index: 100; opacity: 0.3; transition: opacity 0.3s; color: white; border-color: white; }
        .back-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }
        #status { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background-color: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; }
        #status-splash { max-height: 100%; max-width: 100%; margin: auto; }
        #status-progress { bottom: 10%; width: 50%; margin: 0 auto; }
        #status-notice { background-color: #5b3943; border-radius: 0.5rem; border: 1px solid #9b3943; color: #e0e0e0; font-family: sans-serif; padding: 1rem; text-align: center; z-index: 1; display: none; }
    </style>
</head>
<body>
    <a href="all-games.html" class="btn btn-sm btn-outline-light back-btn"><i class="fa fa-arrow-left"></i> Back to Portal</a>

    <canvas id="canvas">Your browser does not support the canvas tag.</canvas>

    <div id="status">
        <img id="status-splash" src="apps/buckshot-roulette/index.png" alt="">
        <progress id="status-progress"></progress>
        <div id="status-notice"></div>
    </div>

    <script src="apps/buckshot-roulette/index.js"></script>
    <script>
        const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"apps/buckshot-roulette/index","experimentalVK":false,"fileSizes":{"apps/buckshot-roulette/index.pck":345524192,"apps/buckshot-roulette/index.wasm":43444261},"focusCanvas":true,"gdextensionLibs":[]};
        const engine = new Engine(GODOT_CONFIG);

        (function () {
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');

            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }
                if (mode === 'hidden') {
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }
                statusOverlay.style.visibility = 'visible';
                statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) {
                    statusNotice.removeChild(statusNotice.lastChild);
                }
                const lines = text.split('\n');
                lines.forEach((line) => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            }

            function displayFailureNotice(err) {
                console.error(err);
                if (err instanceof Error) {
                    setStatusNotice(err.message);
                } else if (typeof err === 'string') {
                    setStatusNotice(err);
                } else {
                    setStatusNotice('An unknown error occurred.');
                }
                setStatusMode('notice');
                initializing = false;
            }

            const missing = Engine.getMissingFeatures({
                threads: false,
            });
            if (missing.length !== 0) {
                displayFailureNotice('Error\nMissing required features:\n' + missing.join('\n'));
            } else {
                setStatusMode('progress');
                engine.startGame({
                    'onProgress': function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');
                }, displayFailureNotice);
            }
        }());
    </script>
</body>
</html>
